# Podman Compose setup for rusty-app database adapter testing
#
# Usage with Podman:
#   podman-compose up -d          # Start all databases
#   podman-compose down           # Stop all databases
#   podman-compose logs postgres  # View PostgreSQL logs
#
# Note: Podman Compose is compatible with Docker Compose syntax

version: '3.8'

services:
  # PostgreSQL 16 for testing PostgresAdapter
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: rusty-app-postgres
    environment:
      POSTGRES_USER: rusty_user
      POSTGRES_PASSWORD: rusty_pass
      POSTGRES_DB: rusty_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./test-data/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusty_user -d rusty_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL 8 for testing MySQLAdapter
  mysql:
    image: docker.io/library/mysql:8
    container_name: rusty-app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: rusty_test
      MYSQL_USER: rusty_user
      MYSQL_PASSWORD: rusty_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./test-data/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rusty_user", "-prusty_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: rusty-app-postgres-data
  mysql_data:
    name: rusty-app-mysql-data
