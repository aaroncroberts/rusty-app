[package]
name = "rusty-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["postgres", "mysql", "sqlite", "mongodb", "mssql", "oracle"]
postgres = ["arni/postgres"]
mysql = ["arni/mysql"]
sqlite = ["arni/sqlite"]
mongodb = ["arni/mongodb"]
mssql = ["arni/mssql"]
oracle = ["arni/oracle"]

[dependencies]
# Data access
arni = { git = "https://github.com/aaroncroberts/arni", features = ["postgres", "mysql", "sqlite", "mongodb", "mssql", "oracle"] }
rusty-logging = { path = "../rusty-logging" }

# Logging (for tracing macros)
tracing = "0.1"

# UI Framework - Iced for modern, GPU-accelerated desktop UI
iced = { version = "0.13", features = ["tokio", "debug"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Configuration
toml = "0.8"
dirs = "5.0"

[dev-dependencies]
uuid = { version = "1.0", features = ["v4"] }
