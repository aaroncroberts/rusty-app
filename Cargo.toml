[workspace]
resolver = "2"
members = [
    "rusty-app",
    "rusty-data",
    "rusty-logging",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Aaron"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Encryption for credentials
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Database drivers (to be added per adapter)
# sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls"] }
