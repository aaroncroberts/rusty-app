[workspace]
resolver = "2"
members = [
    "rusty-app",
    "rusty-logging",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Aaron"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

