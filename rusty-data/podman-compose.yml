# Podman Compose Configuration for Database Testing
#
# This file defines database containers for development and testing.
# Use with: podman-compose up -d
#
# Documentation: ../docs/database/testing.md
# Container naming: icitadel-dev-{platform}
# Data storage: ~/Docker/icitadel-dev-{platform}

version: '3.8'

services:
  # PostgreSQL database for testing
  icitadel-dev-postgres:
    image: postgres:16-alpine
    container_name: icitadel-dev-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - ~/Docker/icitadel-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MySQL database for testing
  icitadel-dev-mysql:
    image: mysql:8.4
    container_name: icitadel-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3306:3306"
    volumes:
      - ~/Docker/icitadel-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "test_user", "-ptest_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB database for testing
  icitadel-dev-mongodb:
    image: mongo:7
    container_name: icitadel-dev-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: test_user
      MONGO_INITDB_ROOT_PASSWORD: test_password
      MONGO_INITDB_DATABASE: test_db
    ports:
      - "27017:27017"
    volumes:
      - ~/Docker/icitadel-dev-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SQL Server database for testing
  icitadel-dev-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: icitadel-dev-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ~/Docker/icitadel-dev-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Oracle database for testing (using Oracle XE - Express Edition)
  icitadel-dev-oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: icitadel-dev-oracle
    environment:
      ORACLE_PASSWORD: test_password
      APP_USER: test_user
      APP_USER_PASSWORD: test_password
    ports:
      - "1521:1521"
    volumes:
      - ~/Docker/icitadel-dev-oracle:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    shm_size: 1gb

# Volume directories are bind-mounted to ~/Docker/{container-name}
# This allows for easy backup, inspection, and persistence across docker-compose down
# The tilde (~) expands to the current user's home directory for portability
